<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <TITLE>Content Shield</TITLE>
    <style>
        body{
            font-family: Arial, sans-serif;
            width: 350px;
            padding: 15px;
            text-align: center;
        }
        #preview-canvas{
            max-width: 100%;
            border: 1px solid #ccc;
            margin-top: 15px;
            display: none;
        }
        button{
            margin-top: 15px;
            padding: 8px 16px;
            background-color: #0a66c2;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover{
            background-color: #004182;
        }
    </style>
    </head>
    <body>
        <h2>Content Shield</h2>
        <p>Select a document to scan for sensitive PII.</p>

        <input type="file" id="image-upload" accept="image/png, image/jpeg" />
        
        <canvas id="preview-canvas"></canvas>

        <button id="scan-btn"> Scan & Redact</button>
        
        <script src="tesseract.min.js"></script>
        <script src="popup.js"></script>
    </body>
</html>
